name: checkin_app
description: Worker clock-in app - GPS based attendance, shift recognition and monthly reports
publish_to: 'none'
version: 0.2.10+15

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  dio: ^5.4.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  package_info_plus: ^8.0.0
  open_file: ^3.3.2
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  camera: ^0.12.0+2
  flutter_image_compress: ^2.5.1
  path_provider: ^2.1.1
  flutter_map_cache: ^2.1.0
  http_cache_file_store: ^2.0.2
  dio_cache_interceptor: ^4.0.7
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  crypto: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
